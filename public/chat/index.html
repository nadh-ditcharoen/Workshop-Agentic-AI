<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172554">
  <title>AI Desk — Chat</title>
  <style>
    :root {
      --navy: #172554;
      --blue: #2563eb;
      --blue-soft: #dbeafe;
      --pink: #ec4899;
      --pink-soft: #fce7f3;
      --yellow: #facc15;
      --ink: #172033;
      --muted: #64748b;
      --line: #e2e8f0;
      --surface: rgba(255, 255, 255, .86);
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 8% 8%, rgba(236, 72, 153, .2), transparent 25rem),
        radial-gradient(circle at 92% 18%, rgba(37, 99, 235, .2), transparent 28rem),
        linear-gradient(135deg, #f8fbff 0%, #fff7fb 52%, #fffbea 100%);
    }

    .page-shell { width: min(100% - 32px, 1080px); margin: 0 auto; padding: 28px 0 36px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 15px; color: white; font-size: 23px; background: linear-gradient(135deg, var(--blue), var(--pink)); box-shadow: 0 10px 24px rgba(37, 99, 235, .25); }
    .brand h1 { margin: 0; color: var(--navy); font-size: clamp(1.35rem, 3vw, 1.75rem); letter-spacing: -.03em; }
    .brand p { margin: 2px 0 0; color: var(--muted); font-size: .82rem; }
    .back-link { display: inline-flex; align-items: center; gap: 7px; padding: 9px 13px; border: 1px solid rgba(37, 99, 235, .16); border-radius: 999px; color: var(--blue); background: rgba(255,255,255,.62); font-size: .88rem; font-weight: 700; text-decoration: none; transition: .2s ease; }
    .back-link:hover { transform: translateY(-2px); background: white; box-shadow: 0 8px 20px rgba(37, 99, 235, .12); }

    .workspace { overflow: hidden; border: 1px solid rgba(255,255,255,.78); border-radius: 26px; background: var(--surface); box-shadow: 0 24px 70px rgba(23, 37, 84, .14); backdrop-filter: blur(14px); }
    .workspace-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 26px; border-bottom: 1px solid rgba(226, 232, 240, .8); background: linear-gradient(100deg, rgba(219,234,254,.72), rgba(252,231,243,.55), rgba(254,249,195,.55)); }
    .workspace-title { display: flex; align-items: center; gap: 12px; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 5px rgba(34,197,94,.15); }
    .workspace-title strong { display: block; color: var(--navy); }
    .workspace-title span { display: block; margin-top: 2px; color: var(--muted); font-size: .78rem; }
    .sparkle { color: #ca8a04; font-size: 1.5rem; }

    .controls { display: grid; grid-template-columns: minmax(190px, .65fr) 1fr; gap: 12px; padding: 18px 26px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.64); }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { color: var(--muted); font-size: .73rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    select, input, button { font: inherit; }
    select, .model-input { width: 100%; padding: 11px 13px; border: 1px solid #cbd5e1; border-radius: 12px; outline: none; color: var(--ink); background: white; transition: .2s ease; }
    select:focus, .model-input:focus, .message-input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(37,99,235,.12); }

    .chat { display: flex; min-height: 470px; max-height: 58vh; flex-direction: column; gap: 6px; overflow-y: auto; padding: 26px; background: linear-gradient(180deg, rgba(255,255,255,.5), rgba(248,250,252,.82)); }
    .empty-state { display: grid; place-items: center; min-height: 390px; padding: 20px; text-align: center; }
    .empty-icon { display: grid; place-items: center; width: 72px; height: 72px; margin-bottom: 15px; border-radius: 24px; color: var(--navy); font-size: 2rem; background: linear-gradient(135deg, var(--yellow), #fde68a); box-shadow: 0 12px 26px rgba(250,204,21,.28); }
    .empty-state h2 { margin: 0 0 7px; color: var(--navy); font-size: 1.25rem; }
    .empty-state p { max-width: 390px; margin: 0; color: var(--muted); line-height: 1.7; }
    .bubble { max-width: min(76%, 650px); padding: 13px 16px; border-radius: 18px; white-space: pre-wrap; line-height: 1.65; animation: rise .25s ease both; }
    .user { align-self: flex-end; border-bottom-right-radius: 5px; color: white; background: linear-gradient(135deg, var(--blue), #4f46e5); box-shadow: 0 8px 18px rgba(37,99,235,.18); }
    .assistant { align-self: flex-start; border-bottom-left-radius: 5px; border: 1px solid rgba(226,232,240,.9); background: white; box-shadow: 0 7px 18px rgba(23,37,84,.06); }
    .thinking { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: .9rem; }
    .thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--pink); animation: pulse 1s infinite; }
    .thinking i:nth-child(2) { animation-delay: .15s; background: var(--blue); }.thinking i:nth-child(3) { animation-delay: .3s; background: #eab308; }

    .composer { display: flex; gap: 10px; padding: 18px 26px 24px; border-top: 1px solid var(--line); background: rgba(255,255,255,.8); }
    .message-input { flex: 1; min-width: 0; padding: 14px 16px; border: 1px solid #cbd5e1; border-radius: 14px; outline: none; color: var(--ink); background: white; transition: .2s ease; }
    .send-button { display: inline-flex; align-items: center; gap: 8px; padding: 0 20px; border: 0; border-radius: 14px; color: white; cursor: pointer; font-weight: 800; background: linear-gradient(135deg, var(--pink), #db2777); box-shadow: 0 9px 18px rgba(236,72,153,.25); transition: .2s ease; }
    .send-button:hover { transform: translateY(-2px); box-shadow: 0 12px 22px rgba(236,72,153,.32); }.send-button:disabled { cursor: wait; opacity: .6; transform: none; }
    .hint { margin: 0; padding: 0 26px 18px; color: #94a3b8; font-size: .76rem; text-align: center; background: rgba(255,255,255,.8); }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%, 100% { opacity: .35; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }
    @media (max-width: 640px) { .page-shell { width: min(100% - 20px, 1080px); padding-top: 16px; }.topbar { align-items: flex-start; }.back-link { font-size: .78rem; }.workspace { border-radius: 20px; }.workspace-head, .controls, .chat, .composer { padding-left: 16px; padding-right: 16px; }.controls { grid-template-columns: 1fr; }.chat { min-height: 52vh; max-height: none; }.bubble { max-width: 88%; }.composer { align-items: stretch; }.send-button { padding: 0 15px; }.send-label { display: none; } }
  </style>
</head>
<body>
  <main class="page-shell">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">✦</div><div><h1>AI Desk</h1><p>คุยกับ AI ได้ในที่เดียว</p></div></div>
      <a class="back-link" href="/">← <span>กลับ Portal Hub</span></a>
    </header>
    <section class="workspace">
      <div class="workspace-head"><div class="workspace-title"><span class="status-dot"></span><div><strong>ห้องสนทนาใหม่</strong><span>เลือก provider แล้วเริ่มคุยได้เลย</span></div></div><div class="sparkle">✦</div></div>
      <div class="controls">
        <div class="field"><label for="provider">Provider</label><select id="provider"><option value="gemini">Google Gemini</option><option value="openai">OpenAI</option><option value="openai-compat">Custom gateway</option></select></div>
        <div class="field"><label for="model">Model</label><input class="model-input" id="model" placeholder="ใช้ค่า default จากระบบ"></div>
      </div>
      <section id="chat" class="chat"><div class="empty-state" id="empty-state"><div><div class="empty-icon">💬</div><h2>พร้อมช่วยคุณแล้ว</h2><p>ถามคำถาม ระดมไอเดีย หรือให้ AI ช่วยคิดสิ่งใหม่ ๆ ได้เลย</p></div></div></section>
      <form id="form" class="composer"><input class="message-input" id="message" autocomplete="off" placeholder="พิมพ์ข้อความของคุณที่นี่..." required><button class="send-button" id="send" type="submit"><span class="send-label">ส่งข้อความ</span> <span>➜</span></button></form>
      <p class="hint">ประวัติการสนทนาจะอยู่ในหน้านี้เท่านั้น และไม่ถูกบันทึกข้ามการรีโหลด</p>
    </section>
  </main>
  <script src="/chat/app.js"></script>
</body>
</html>
