<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Desk — Chat</title><style>body{font-family:system-ui,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:800px;margin:auto;padding:24px 16px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}a{color:#5264c8}.settings{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}select,input,button{font:inherit;padding:10px;border:1px solid #ccd3e0;border-radius:8px}input{flex:1;min-width:180px}.chat{min-height:55vh;background:#fff;border:1px solid #e1e6ef;border-radius:14px;padding:16px}.bubble{max-width:78%;padding:11px 14px;border-radius:14px;margin:10px 0;white-space:pre-wrap}.user{margin-left:auto;background:#5264c8;color:#fff}.assistant{background:#eef1f7}.composer{display:flex;gap:8px;margin-top:12px}.composer input{padding:13px}button{cursor:pointer;background:#5264c8;color:#fff;border:0}button:disabled{opacity:.5}</style></head><body><main class="wrap"><header><h1>💬 Chat</h1><a href="/">กลับ Portal Hub</a></header><div class="settings"><label>Provider <select id="provider"><option value="gemini">Gemini</option><option value="openai">OpenAI</option><option value="openai-compat">Custom gateway</option></select></label><label>Model <input id="model" placeholder="ใช้ค่า default จากระบบ"></label></div><section id="chat" class="chat"><p>เริ่มต้นการสนทนาได้เลย</p></section><form id="form" class="composer"><input id="message" autocomplete="off" placeholder="พิมพ์ข้อความ..." required><button id="send">ส่ง</button></form></main><script src="/chat/app.js"></script></body></html>
